[package]
name = "libpandoc-ast"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "pandoc's document AST, generated from pandoc-types: types, pandoc's JSON, a visitor"
license = "BSD-3-Clause"
repository = "https://github.com/ickc/libpandoc-ast"
keywords = ["pandoc", "ast", "markdown", "filter"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

[dev-dependencies]
serde_json = { version = "1", features = ["raw_value"] }

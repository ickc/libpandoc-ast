name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # schema/ and corpus/ are generated from pandoc-types and committed: check
  # they are what the pinned pandoc-types gives.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read pins
        run: grep -v "^#" pins.env >> "$GITHUB_ENV"
      - uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: schema-${{ env.GHC_VERSION }}-${{ env.INDEX_STATE }}-${{ hashFiles('haskell/*.cabal') }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate
        run: pixi run bash scripts/generate.sh
      - name: Generated files are current
        run: git diff --exit-code

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
        env: [py310, py314]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Lint
        if: matrix.env == 'py314' && matrix.os == 'ubuntu-latest'
        run: pixi run -e py314 lint
      - name: Test the source
        run: pixi run -e ${{ matrix.env }} test-python
      - name: Test the installed wheel
        shell: bash
        run: |
          pixi run -e ${{ matrix.env }} python -m pip wheel --no-deps -w wheelhouse ./python
          pixi run -e ${{ matrix.env }} python -m venv --system-site-packages venv
          if [ -d venv/Scripts ]; then py=venv/Scripts/python; else py=venv/bin/python; fi
          $py -m pip install --no-deps wheelhouse/*.whl
          cp -r python/tests corpus "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/python" && mv "$RUNNER_TEMP/tests" "$RUNNER_TEMP/python/"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$py" -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        if: matrix.env == 'py314' && matrix.os == 'ubuntu-latest'
        with:
          name: python-wheel
          path: wheelhouse/*.whl

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: The example runs as a pandoc filter
        shell: bash
        run: |
          cargo build --example upper
          out=$(echo 'some *text*' | pixi run --manifest-path ../pixi.toml pandoc --filter target/debug/examples/upper -t plain)
          echo "$out"
          [ "$out" = "SOME TEXT" ]

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ts
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      - run: npm ci
      - run: npx tsc -p tsconfig.test.json
      - run: npm test
      - run: npm run build
      - name: The example runs as a pandoc filter
        run: |
          out=$(echo 'some *text*' | pixi run --manifest-path ../pixi.toml pandoc --filter examples/upper.mjs -t plain)
          echo "$out"
          [ "$out" = "SOME TEXT" ]

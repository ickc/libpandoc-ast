# The Python package for conda: pure Python, one package for every platform.
#
#   rattler-build build -r python/recipe -c https://prefix.dev/pandoc-forge/dev -c conda-forge
#
# pandoc-api (from pandoc-forge) pins the AST version: the generated types
# are for exactly one, schema/pandoc-ast.json's "pandoc-api-version".
context:
  version: "0.1.0"

package:
  name: pandom
  version: ${{ version }}

source:
  path: ../..

build:
  number: 0
  noarch: python
  script: python -m pip install ./python -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    # major.minor of schema/pandoc-ast.json's pandoc-api-version
    - pandoc-api 1.23.*

tests:
  - python:
      imports:
        - pandom
      python_version: ${{ python_min }}.*
  - files:
      source:
        - python/tests/
        - corpus/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - pandoc
    script:
      - pytest -v python/tests

about:
  homepage: https://github.com/ickc/pandom
  repository: https://github.com/ickc/pandom
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pandoc's document AST, generated from pandoc-types, with checks and filters
